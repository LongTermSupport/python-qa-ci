# py-qa-ci runs its own pipeline on itself: the bundled Pylint defences, the suppression
# scan, the record and the documentation check all run on this source exactly as they run in a
# consuming project. CI is set, so the formatter checks rather than fixes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # uv from PyPI, pinned, so the lock file is read by the version that wrote it.
      - name: Install
        run: |
          python -m pip install uv==0.12.24
          uv sync --locked --python "$(command -v python)"
      - name: py-qa run
        run: uv run py-qa run
