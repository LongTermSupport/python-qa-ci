# python-qa's mypy configuration, used only when a project has no mypy configuration of its own
# (no [tool.mypy], mypy.ini, .mypy.ini or [mypy] in setup.cfg).
[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "unused-awaitable",
]

# astroid, which every Pylint plugin is written against, is annotated but ships no py.typed
# marker. Following it type-checks plugin code against those annotations instead of skipping
# the import.
[[tool.mypy.overrides]]
module = ["astroid", "astroid.*"]
follow_untyped_imports = true
